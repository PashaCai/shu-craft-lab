   hibiscus is shaded by stitches adjoining and overlapping, their direction following
   each petal. Thread travels through the same cloth to its other face and the end is buried.
   In exploded view only: stitches spread out from either face so their return path is clear.
   Parts: scroll feet, support uprights, transverse brace, pivot washers, locking knobs,
   frame side rails, rollers, journals, laces, ground, front and reverse stitches, needle,
   eye, working silk, reel pegs, coloured spools, small tray and needle cushion. */
